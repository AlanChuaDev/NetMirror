name: Build NetMirror APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add build-tools to PATH
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$BT" >> $GITHUB_PATH

      - name: Install Apktool 3.0.3
        run: |
          mkdir -p $HOME/bin
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O $HOME/bin/apktool.jar
          printf '#!/bin/sh\nexec java -jar "%s/bin/apktool.jar" "$@"\n' "$HOME" > $HOME/bin/apktool
          chmod +x $HOME/bin/apktool
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build APK
        run: apktool b . -o NetMirror_unaligned.apk

      - name: Align, sign, and verify APK
        run: |
          zipalign -v -p 4 NetMirror_unaligned.apk NetMirror_aligned.apk
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out NetMirror_signed.apk NetMirror_aligned.apk
          apksigner verify --verbose NetMirror_signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror_signed
          path: NetMirror_signed.apk
