name: Build NetMirror APK

on:
  workflow_run:
    workflows: ["Extract Uploaded ZIP"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and framework image
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils
          SYSTEM_IMAGE="$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
          simg2img "$SYSTEM_IMAGE" "$RUNNER_TEMP/android-system.img"
          sudo mkdir -p /mnt/android-system
          sudo mount -o loop,ro "$RUNNER_TEMP/android-system.img" /mnt/android-system
          FRAMEWORK_RES="$(find /mnt/android-system -name framework-res.apk -print -quit)"
          if [ -z "$FRAMEWORK_RES" ]; then
            echo "framework-res.apk not found in Android 35 system image"
            exit 1
          fi
          echo "FRAMEWORK_RES=$FRAMEWORK_RES" >> "$GITHUB_ENV"

      - name: Install Apktool 3.0.3
        run: |
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" > "$RUNNER_TEMP/apktool"
          chmod +x "$RUNNER_TEMP/apktool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          apktool --version
          apktool if -p "$RUNNER_TEMP/apktool-framework" "$FRAMEWORK_RES"

      - name: Build APK
        run: |
          apktool b -p "$RUNNER_TEMP/apktool-framework" . -o "$RUNNER_TEMP/NetMirror-unsigned.apk"

      - name: Align, sign, and verify APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RUNNER_TEMP/NetMirror-unsigned.apk" "$RUNNER_TEMP/NetMirror-aligned.apk"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/netmirror-local.jks" -storepass android -keypass android -alias netmirror -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NetMirror Local Build,O=Local,C=MY"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/netmirror-local.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/NetMirror-custom.apk" "$RUNNER_TEMP/NetMirror-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/NetMirror-custom.apk"
          sha256sum "$RUNNER_TEMP/NetMirror-custom.apk" > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Basic malware signature scan
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo freshclam
          clamscan --infected --no-summary "$RUNNER_TEMP/NetMirror-custom.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-custom-APK
          path: |
            ${{ runner.temp }}/NetMirror-custom.apk
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
